<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staal Spelling Oefenplatform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- SCHERM 1: INTAKE -->
    <div id="screen-intake" class="screen active">
        <h1>Staal Spellingsoefenaar 🚀</h1>
        <p>Vul je gegevens in om te starten met oefenen!</p>
        <input type="text" id="student-name" placeholder="Wat is je naam?" required><br>
        
        <select id="student-group">
            <option value="4">Groep 4 (Max Categorie 12)</option>
            <option value="5">Groep 5 (Max Categorie 19)</option>
            <option value="6">Groep 6 (Max Categorie 28)</option>
        </select><br>

        <select id="student-block">
            <option value="1">Blok 1</option>
            <option value="2">Blok 2</option>
            <option value="3">Blok 3</option>
            <option value="4">Blok 4</option>
            <option value="5">Blok 5</option>
            <option value="6">Blok 6</option>
            <option value="7">Blok 7</option>
            <option value="8">Blok 8 (Hele jaar)</option>
        </select><br>

        <select id="game-mode">
            <option value="oefen">Oefenmodus (Interactief Hakken)</option>
        </select><br>
        
        <button onclick="startSpel()">Start het spel! 🏁</button>
        
        <div style="margin-top: 30px; font-weight: bold; color: var(--staal-blue);" id="high-score-display">
            🏆 Persoonlijk Record: 0 punten
        </div>
    </div>

    <!-- SCHERM 2: HET SPEL -->
    <div id="screen-game" class="screen">
        <div class="header-bar">
            <div class="header-left">
                <span id="display-name">Naam</span> | 
                <span id="display-group">Groep</span> | 
                <span id="display-block">Blok</span>
            </div>
            <div class="header-right">
                <span>Woord: <span id="display-word-count">1/20</span></span> | 
                <span>Punten: <span id="display-score">0</span></span> | 
                <span>Sterren: <span id="display-stars">⭐ 0</span></span>
            </div>
        </div>

        <div class="game-layout-horizontal">
            
            <div class="instruction-banner" id="current-instruction">
                Stap 1: Is dit een samenstelling? Klik dan onderaan op de ster!
            </div>

            <!-- Gecentreerde Woordwerkruimte (Sterk vereenvoudigd!) -->
            <div class="workspace-area-center">
                <div class="interactive-word-wrapper">
                    <span id="samenstelling-star-indicator" class="star-indicator">⭐</span>
                    <div id="interactive-word-container" class="word-letters-grid">
                        <!-- Letters, badges en haklijnen worden hier samen in 1 div opgebouwd -->
                    </div>
                </div>
            </div>

            <div class="action-bar-center">
                <button id="check-btn" onclick="controleerAntwoord()">Controleer Antwoord! ✔️</button>
                <button id="next-btn" onclick="volgendWoord()" style="display:none; background-color: #4caf50; box-shadow: 0 4px 0 #388e3c; color: white;">Volgend woord ➡️</button>
            </div>

            <div id="feedback-box" class="feedback"></div>

            <!-- Onderste Categoriebalk -->
            <div class="bottom-scroll-column">
                <div class="bottom-toolbar">
                    <button id="samenstelling-toggle-btn" class="samenstelling-btn" onclick="toggleSamenstelling()">⭐ Samenstelling</button>
                    <p style="color: white; font-weight: bold; margin: 0; font-size: 14px;">
                        Klik op de spellingscategorieën:
                    </p>
                </div>
                <div class="grid-container-multiline">
                    <div id="category-container" class="category-grid-multiline"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="config.js"></script>
<script src="ui.js"></script>
<script src="checker.js"></script>
<script src="game.js"></script>

</body>
</html>
